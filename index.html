<!doctype html>
<!--
  Budgetfor2026 static app
  Local run: open this file directly in a browser (double-click index.html).
  Vercel deploy: import repo/project as a static site (no build command, output directory root).
  GitHub Pages: Settings -> Pages -> Deploy from branch -> main/(root).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgetfor2026</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Budget<span>2026</span></div>
        <nav id="nav">
          <button class="nav-btn active" data-view="dashboard">Dashboard</button>
          <button class="nav-btn" data-view="transactions">Transactions</button>
          <button class="nav-btn" data-view="budgets">Budgets</button>
          <button class="nav-btn" data-view="debts">Debts</button>
          <button class="nav-btn" data-view="goals">Goals</button>
          <button class="nav-btn" data-view="reports">Reports</button>
          <button class="nav-btn" data-view="settings">Settings</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar card">
          <div>
            <h1 id="viewTitle">Dashboard</h1>
            <p class="muted">Last saved: <span id="lastSaved">—</span> · Last backup: <span id="lastBackup">—</span></p>
          </div>
          <div class="toolbar">
            <input id="activeMonth" type="month" />
            <button class="btn primary" data-open-modal="transaction" data-mode="create">+ Add Transaction</button>
          </div>
        </header>

        <section id="dashboard" class="view active">
          <div id="summaryCards" class="grid cards"></div>
          <div class="grid two">
            <article class="card"><h3>Income vs Expenses</h3><canvas id="chartBar" width="520" height="240"></canvas></article>
            <article class="card"><h3>Expense Categories</h3><canvas id="chartPie" width="520" height="240"></canvas></article>
          </div>
          <div class="grid one">
            <article class="card"><h3>Net Cash Flow (6 months)</h3><canvas id="chartTrend" width="1060" height="260"></canvas></article>
          </div>
        </section>

        <section id="transactions" class="view">
          <div class="section-head">
            <h2>Transactions</h2>
            <div class="toolbar">
              <input id="searchTx" type="search" placeholder="Search description" />
              <select id="filterCategory"></select>
            </div>
          </div>
          <div id="transactionsTable" class="card"></div>
        </section>

        <section id="budgets" class="view">
          <div class="section-head">
            <h2>Budgets</h2>
            <button class="btn" data-open-modal="budget" data-mode="create">Edit Category Limit</button>
          </div>
          <div id="budgetList" class="card"></div>
        </section>

        <section id="debts" class="view">
          <div class="section-head">
            <h2>Debts</h2>
            <div class="toolbar">
              <button class="btn" data-open-modal="debt" data-mode="create">Add Debt</button>
              <button class="btn" data-open-modal="payment" data-mode="create">Record Payment</button>
            </div>
          </div>
          <div class="grid two">
            <article id="debtList" class="card"></article>
            <article class="card"><h3>Payoff Simulator</h3><div id="debtSimulator"></div></article>
          </div>
        </section>

        <section id="goals" class="view">
          <div class="section-head">
            <h2>Goals</h2>
            <button class="btn" data-open-modal="goal" data-mode="create">Add Goal</button>
          </div>
          <div id="goalList" class="card"></div>
        </section>

        <section id="reports" class="view">
          <div class="section-head">
            <h2>Reports</h2>
            <div class="toolbar">
              <select id="reportTrendMetric">
                <option value="net">Net cash flow</option>
                <option value="income">Income</option>
                <option value="expense">Expenses</option>
              </select>
              <button id="exportReport" class="btn">Export report (JSON)</button>
            </div>
          </div>
          <article id="reportSummary" class="card"></article>
          <div class="grid two">
            <article id="reportCategory" class="card"></article>
            <article class="card"><h3>Category Pie</h3><canvas id="reportPie" width="520" height="240"></canvas></article>
          </div>
          <article class="card"><h3>6-Month Trends</h3><canvas id="reportTrend" width="1060" height="260"></canvas></article>
        </section>

        <section id="settings" class="view">
          <h2>Settings</h2>
          <article class="card settings">
            <label><input type="checkbox" id="toggleCents" checked /> Show cents</label>
            <button id="saveSnapshot" class="btn">Save net worth snapshot</button>
            <button id="exportData" class="btn">Export full data JSON</button>
            <label class="btn" for="importData">Import JSON</label>
            <input id="importData" type="file" accept="application/json" hidden />
            <button id="resetData" class="btn danger">Reset data</button>
            <div id="importPreview" class="muted"></div>
          </article>
        </section>
      </main>
    </div>

    <dialog id="modal">
      <form id="modalForm" method="dialog" novalidate>
        <div class="modal-head">
          <h3 id="modalTitle">Form</h3>
          <button type="button" class="icon" data-close-modal>×</button>
        </div>
        <div id="modalFields" class="fields"></div>
        <p id="modalError" class="error"></p>
        <div class="toolbar right">
          <button type="button" class="btn" data-close-modal>Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
